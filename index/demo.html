<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    @font-face {
      font-family: "poppins";
      src: url("../fonts/Poppins-Medium.ttf");
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-image: url('/mnt/data/image.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      font-family: poppins;
      overflow-x: hidden;
    }

    #logo {
      width: 200px;
    }

    .navbar-search {
      display: flex;
    }

    #navbar-search {
      width: 500px;
      height: 50px;
      font-family: poppins;
      text-align: center;
      border-radius: 10px;
      border: 1px solid #000000;
    }

    #search-btn {
      width: 50px;
      height: 50px;
      background-color: #688cee;
      color: #000000;
      border-radius: 6px;
      border: none;
      margin-left: 10px;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
    }

    .search-img {
      width: 50px;
      height: 50px;
      border-radius: 10px;
    }

    #nav-1 {
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-family: poppins;
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 20px;
      border-radius: 18px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
      padding: 10px;
    }

    #nav-1 a {
      text-decoration: none;
      padding: 20px;
      font-size: 1.2rem;
      color: inherit;
    }

    #nav-1 a:hover {
      color: #0312a0;
      animation: 1s ease-in-out;
    }

    .nav-links {
      display: flex;
      gap: 18px;
    }

    .nav-links a {
      position: relative;
      display: inline-block;
    }

    .nav-links i {
      font-size: 1.5rem;
    }

    .badge {
      position: absolute;
      top: 4px;
      right: 1px;
      width: 19px;
      height: 19px;
      background: transparent;
      color: #fff;
      border-radius: 50%;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
    }

    #nav-2 {
      font-family: poppins;
      background-color: transparent;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      margin-left: 30px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    #nav-2 a {
      text-decoration: none;
      padding: 20px;
      font-size: 1.2rem;
      color: inherit;
    }

    #nav-2 a:hover {
      color: #0312a0;
      transition: 1s ease-in-out;
    }

    .toggle-container {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }

    #toggle-navbar {
      background: white;
      padding: 8px 16px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    #toggle-navbar img {
      width: 28px;
      height: 28px;
    }

    .side-navbar {
      border: 1px solid #ffffff;
      border-radius: 14px;
      width: 300px;
      background: #2f2f99f2;
      opacity: 0.9;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      position: absolute;
      left: 20px;
      top: 120px;
      z-index: 1000;
    }

    .side-navbar.hidden {
      transform: translateX(-120%);
      opacity: 0;
      pointer-events: none;
    }

    .close-navbar {
      position: absolute;
      top: 10px;
      right: 10px;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .close-navbar img {
      width: 24px;
      height: 24px;
    }
  </style>
</head>
<body>
  <!-- Top Navigation Bars -->
  <nav id="nav-1">
    <div class="logo">
      <img id="logo" src="./logo.png" alt="Logo">
    </div>
    <div class="navbar-search">
      <input type="search" name="search" id="navbar-search" placeholder="Search for products">
      <button id="search-btn"><img class="search-img" src="./search.png" alt="search"></button>
    </div>
    <div class="nav-links">
      <a href="./login.html"><i class="fa-solid fa-user"></i></a>
      <a href="./cart.html">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="badge badge-cart">1</span>
      </a>
    </div>
  </nav>

  <nav id="nav-2">
    <div class="nav-2">
      <a href="./index.html">Home</a>
      <a href="./shop.html">Shop</a>
      <a href="./contact.html">Contact Us</a>
    </div>
  </nav>

  <!-- Toggle Button as Bubble -->
  <div class="toggle-container" id="toggleContainer">
    <button id="toggle-navbar">
      <img src="https://img.icons8.com/ios-filled/50/filter.png" alt="Toggle Filters">
    </button>
  </div>

  <!-- Side Navbar -->
  <div class="side-navbar hidden" id="sideNavbar">
    <button class="close-navbar" id="closeNavbar">
      <img src="https://img.icons8.com/ios-glyphs/30/multiply.png" alt="Close">
    </button>
    <div class="side-navbar-row">
      <div class="side-navbar-category">
        <h2 class="categories-head">All Categories</h2>
        <div class="categories-search">
          <input type="search" name="search" id="search-bar" placeholder="Find a categories">
          <button id="search-btn">
            <img class="category-search-img" src="./search.png" alt="search">
          </button>
        </div>
        <ul class="categories-list">
          <li><input type="checkbox" class="category-checkbox" id="jewellery"><label for="jewellery"><a href="#">Jewellery</a></label></li>
          <li><input type="checkbox" class="category-checkbox" id="women-fashion"><label for="women-fashion"><a href="#">Women Fashion</a></label></li>
          <li><input type="checkbox" class="category-checkbox" id="men-shoes"><label for="men-shoes"><a href="#">Men Shoes</a></label></li>
        </ul>
      </div>

      <div class="side-navbar-price">
        <h2 class="price-head">Filter By Price</h2>
        <ul class="price-list">
          <li><input type="checkbox" class="price-checkbox" id="price-1"><label for="price-1">Rs:0 - Rs:500</label></li>
          <li><input type="checkbox" class="price-checkbox" id="price-2"><label for="price-2">Rs:500 - Rs:1000</label></li>
          <li><input type="checkbox" class="price-checkbox" id="price-3"><label for="price-3">Rs:1,000 - Rs:1,500</label></li>
          <li><input type="checkbox" class="price-checkbox" id="price-4"><label for="price-4">Rs:1,500 - Rs:2,000</label></li>
        </ul>
        <div class="sidebar-apply-btn">
          <button class="apply-btn">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const toggleButton = document.getElementById('toggle-navbar');
    const toggleContainer = document.getElementById('toggleContainer');
    const sideNavbar = document.getElementById('sideNavbar');
    const closeNavbar = document.getElementById('closeNavbar');

    toggleButton.addEventListener('click', () => {
      sideNavbar.classList.remove('hidden');
      toggleContainer.style.display = 'none';
    });

    closeNavbar.addEventListener('click', () => {
      sideNavbar.classList.add('hidden');
      toggleContainer.style.display = 'flex';
    });
  </script>
</body>
</html>
