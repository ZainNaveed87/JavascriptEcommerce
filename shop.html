<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: "poppins";
      src: url("../fonts/Poppins-Medium.ttf");
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-image: url('./image.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      font-family: poppins;
      overflow-x: hidden;
    }

    #logo {
      width: 200px;
    }

    .navbar-search {
      display: flex;
    }

    #navbar-search {
      width: 500px;
      height: 50px;
      font-family: poppins;
      text-align: center;
      border-radius: 10px;
    }

    #search-btn {
  position: absolute;
  width: 60px;
  height: 40px;
  left: 228px;
  right: 20px;
  color: #fff;
  background: linear-gradient(120deg, #181852 80%, #3a3a90 100%);
  border-radius: 6px;
  border: none;
  margin-left: 10px;
  cursor: pointer;
  transition: all 0.3s ease-in-out;
  box-shadow: 0 2px 8px #18185255;
  overflow: hidden;
}

#search-btn::after {
  content: "";
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(120deg, rgba(80,80,120,0.25) 0%, rgba(80,80,120,0) 60%);
  transform: rotate(25deg);
  pointer-events: none;
  transition: opacity 0.3s;
  opacity: 0;
}

#search-btn:hover::after {
  opacity: 1;
  animation: shine 0.7s linear;
}

@keyframes shine {
  0% { left: -80%; opacity: 0.2; }
  60% { left: 100%; opacity: 0.5; }
  100% { left: 180%; opacity: 0; }
}
    .search-img {
      width: 50px;
      height: 50px;
      border-radius: 10px;
    }

    #nav-1 {
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-family: poppins;
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 20px;
      border-radius: 18px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
      padding: 10px;
    }

    #nav-1 a {
      text-decoration: none;
      padding: 20px;
      font-size: 1.2rem;
      color: inherit;
    }

    #nav-1 a:hover {
      color: #0312a0;
      animation: 1s ease-in-out;
    }

    .nav-links {
      display: flex;
      gap: 18px;
    }

    .nav-links a {
      position: relative;
      display: inline-block;
    }

    .nav-links i {
      font-size: 1.5rem;
    }

    .badge {
      position: absolute;
      top: 4px;
      right: 1px;
      width: 19px;
      height: 19px;
      background: transparent;
      color: #fff;
      border-radius: 50%;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
    }

    #nav-2 {
      font-family: poppins;
      background-color: transparent;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      margin-left: 30px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    #nav-2 a {
      text-decoration: none;
      padding: 20px;
      font-size: 1.2rem;
      color: inherit;
    }

    #nav-2 a:hover {
      color: #0312a0;
      transition: 1s ease-in-out;
    }

    .toggle-container {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }

    #toggle-navbar {
      position: sticky; /* Sticky position */
  top: 20px; /* Distance from the top */
  background: white;
  padding: 8px 16px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
  margin-right: 1230px;
  margin-top: 20px;
  z-index: 1000;
     
    }

    #toggle-navbar img {
      width: 28px;
      height: 28px;
    }

    .side-navbar {
      border: 1px solid #ffffff;
      border-radius: 14px;
      width: 300px;
      background: #2f2f99f2;
      opacity: 0.9;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
      height: 500px;
      overflow-y: auto;
      position: absolute;
      left: 20px;
      top: 190px;
      z-index: 1000;
    }

    .side-navbar.hidden {
      transform: translateX(-120%);
      opacity: 0;
      pointer-events: none;
    }

    .close-navbar {
      position: absolute;
      top: 10px;
      right: 10px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: #FFFFFF;
    }
    .close-navbar:hover {
  color: #ff0000;
  transition:  color 0.3s ease; 
}
 
    #search-bar
    {  
        position: relative;
        width: 100%;
        height: 40px;
        border-radius: 10px;
        border: 1px solid #000000;
        padding-left: 10px;
        font-family: poppins;
    }
    .categories-list
    {
        position: absolute;
        top: 130px;
    }
.categories-list a
{
         text-decoration: none;
color: #FFFFFF;
}
.category-checkbox
{
    width: 15px;
    height: 15px;
}
.category_names
{
    margin-left: 10px;
}
.nav-search-btn
{
border-radius: 0px;
border: none;
}
.price-head
{
    color: #FFFFFF;
margin-top: 100px;
text-align: center;

  }
  .price
  {
    color: #FFFFFF;
    margin-left: 10px;
  }
  .apply-btn
  {
    color: white;
    background-color: #0312a0;
    width: 90px;
    height: 30px;
    border-radius: 20px;
    box-shadow: grey 0px 0px 10px;
   margin-left: 20%;
   margin-top: 10px;

  }
  </style>
</head>
<body>
  <!-- Top Navigation Bars -->
  <nav id="nav-1">
    <div class="logo">
      <img id="logo" src="./logo.png" alt="Logo">
    </div>
    <div class="navbar-search">
      <input type="search" name="search" id="navbar-search" placeholder="Search for products">
      <button id="nav-search-btn"><img class="search-img" src="./search.png" alt="search"></button>
    </div>
    <div class="nav-links">
      <a href="./login.html"><i class="fa-solid fa-user"></i></a>
      <a href="./cart.html">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="badge badge-cart">1</span>
      </a>
    </div>
  </nav>

  <nav id="nav-2">
    <div class="nav-2">
      <a href="./index.html">Home</a>
      <a href="./shop.html">Shop</a>
      <a href="./contact.html">Contact Us</a>
    </div>
  </nav>

  <!-- Toggle Button as Bubble -->
  <div class="toggle-container" id="toggleContainer">
    <button id="toggle-navbar">
      <img src="https://img.icons8.com/ios-filled/50/filter.png" alt="Toggle Filters">
    </button>
  </div>

  <!-- Side Navbar -->
  <div class="side-navbar hidden" id="sideNavbar">
    <button class="close-navbar" id="closeNavbar">
      <!-- <img src="https://img.icons8.com/ios-glyphs/30/multiply.png" alt="Close"> -->
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="side-navbar-row">
      <div class="side-navbar-category">
        <h2 style="color: #FFFFFF; text-align: center; margin-top: 30px;" class="categories-head">All Categories</h2>
        <div class="categories-search">
          <input type="search" name="search" id="search-bar" placeholder="Find a categories">
          <button id="search-btn">
            <i class="fa-brands fa-searchengin"></i>
          </button>
        </div>
        <ul class="categories-list" id="categoriesList">
          <li><input type="checkbox" class="category-checkbox" id="jewellery"><label for="jewellery"><a href="#" class="category_names">Jewellery</a></label></li>
          <li><input type="checkbox" class="category-checkbox" id="women-fashion"><label for="women-fashion"><a href="#" class="category_names">Women Fashion</a></label></li>
          <li><input type="checkbox" class="category-checkbox" id="men-shoes"><label for="men-shoes"><a href="#" class="category_names">Men Shoes</a></label></li>
        </ul>
      </div>

      <div class="side-navbar-price">
        <h2 class="price-head">Filter By Price</h2>
        <ul class="price-list">
          <li><input type="checkbox" class="price-checkbox" id="price-1"><label for="price-1" class="price">Rs:0 - Rs:500</label></li>
          <li><input type="checkbox" class="price-checkbox" id="price-2"><label for="price-2" class="price">Rs:500 - Rs:1000</label></li>
          <li><input type="checkbox" class="price-checkbox" id="price-3"><label for="price-3" class="price">Rs:1,000 - Rs:1,500</label></li>
          <li><input type="checkbox" class="price-checkbox" id="price-4"><label for="price-4" class="price">Rs:1,500 - Rs:2,000</label></li>
        </ul>
        <div class="sidebar-apply-btn">
          <button class="apply-btn">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const toggleButton = document.getElementById('toggle-navbar');
    const toggleContainer = document.getElementById('toggleContainer');
    const sideNavbar = document.getElementById('sideNavbar');
    const closeNavbar = document.getElementById('closeNavbar');

    toggleButton.addEventListener('click', () => {
      sideNavbar.classList.remove('hidden');
      toggleContainer.style.display = 'none';
    });

    closeNavbar.addEventListener('click', () => {
      sideNavbar.classList.add('hidden');
      toggleContainer.style.display = 'flex';
    });
    document.addEventListener("DOMContentLoaded", function () {
  const categoriesList = document.getElementById("categoriesList");
  const searchBar = document.getElementById("search-bar");

  if (!categoriesList || !searchBar) {
    console.error("categoriesList or searchBar element not found in the DOM.");
    return;
  }

  // LocalStorage se categories fetch karna
  const categories = JSON.parse(localStorage.getItem("categories")) || [];
  console.log("Fetched categories from localStorage:", categories);

  if (categories.length === 0) {
    console.warn("No categories found in localStorage.");
  }

  // Sirf pehli 3 categories dikhana
  function renderCategories(filteredCategories = categories) {
    categoriesList.innerHTML = ""; // Purani categories clear karna
    const visibleCategories = filteredCategories.slice(0, 3); // Sirf 3 categories lena

    visibleCategories.forEach((category) => {
      const li = document.createElement("li");
      li.innerHTML = `
        <input type="checkbox" class="category-checkbox" id="${category.category}">
        <label for="${category.category}">
          <a href="#" class="category_names">${category.category}</a>
        </label>
      `;
      categoriesList.appendChild(li);
    });

    console.log("Rendered categories:", visibleCategories);
  }

  // Search functionality
  searchBar.addEventListener("input", function () {
    const searchTerm = searchBar.value.trim().toLowerCase();
    const filteredCategories = categories.filter((category) =>
      category.category.includes(searchTerm)
    );
    renderCategories(filteredCategories);
  });

  // Initial render
  renderCategories();
});
  </script>
</body>
</html>
